<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIUM — Jadwal Piket &amp; Surat Dinas</title>
    <meta name="description" content="Aplikasi SIUM pembuat Surat Dinas dan pengelola jadwal piket harian yang berjalan 100% offline." />
    <meta property="og:title" content="SIUM — Jadwal Piket &amp; Surat Dinas" />
    <meta property="og:description" content="Aplikasi SIUM pembuat Surat Dinas dan pengelola jadwal piket harian yang berjalan 100% offline." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#17130f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SIUM" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('kuat_pers_theme_mode_v1');
          var root = document.documentElement;
          if (mode === 'light') {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f4f1ea');
          } else {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#f4f1ea] text-slate-900 dark:bg-[#12100d] dark:text-[#f3ede4] antialiased selection:bg-amber-200 selection:text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
